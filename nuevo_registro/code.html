<div aria-hidden="true" class="flex flex-col gap-md px-margin-page py-6 pointer-events-none select-none">
<!-- Summary Card -->
<div class="w-full bg-primary text-on-primary rounded-[20px] p-6 shadow-[0_4px_10px_rgba(15,23,42,0.05)] flex flex-col gap-xs">
<span class="font-label-md text-primary-fixed-dim uppercase tracking-wider">Gasto Mensual</span>
<span class="font-display-lg-mobile">$4,250.00</span>
<div class="flex items-center gap-1 mt-2 text-primary-fixed">
<span class="material-symbols-outlined text-[16px]">trending_up</span>
<span class="font-label-sm">+12% vs mes anterior</span>
</div>
</div>
<!-- Recent Activity Skeleton -->
<div class="flex flex-col gap-sm">
<span class="font-headline-sm text-on-surface">Actividad Reciente</span>
<div class="w-full bg-surface-container-lowest rounded-[20px] shadow-[0_4px_10px_rgba(15,23,42,0.05)] p-4 flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant">local_gas_station</span>
</div>
<div class="flex flex-col flex-1 gap-1">
<div class="h-4 w-24 bg-surface-container rounded-sm"></div>
<div class="h-3 w-16 bg-surface-container-low rounded-sm"></div>
</div>
<div class="h-5 w-12 bg-surface-container rounded-sm"></div>
</div>
</div>
</div>

<div class="fixed inset-0 z-40 bg-on-surface/40 backdrop-blur-sm opacity-0 transition-opacity duration-300 ease-out" id="scrim"></div>

<div class="fixed bottom-0 left-0 right-0 z-50 bg-surface rounded-t-[32px] flex flex-col pt-3 pb-[max(24px,env(safe-area-inset-bottom))] shadow-[0_-8px_32px_rgba(0,0,0,0.12)] translate-y-full transition-transform duration-400 ease-[cubic-bezier(0.2,0.8,0.2,1)]" id="bottom-sheet">

<button class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center text-on-surface-variant active:bg-surface-container transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Category Selector -->
<div class="flex gap-3 w-full">
<!-- Active Category -->
<button class="flex-1 h-[72px] flex flex-col items-center justify-center gap-1 bg-primary text-on-primary rounded-[20px] shadow-[0_4px_10px_rgba(0,88,190,0.2)] transition-transform active:scale-95">
<span class="text-[24px] leading-none mb-1">⛽</span>
<span class="font-label-md">Gasolina</span>
</button>
<!-- Inactive Category 1 -->
<button class="flex-1 h-[72px] flex flex-col items-center justify-center gap-1 bg-surface-container-low text-on-surface-variant rounded-[20px] transition-colors active:bg-surface-container">
<span class="text-[24px] leading-none mb-1">🔧</span>
<span class="font-label-md">Taller</span>
</button>
<!-- Inactive Category 2 -->
<button class="flex-1 h-[72px] flex flex-col items-center justify-center gap-1 bg-surface-container-low text-on-surface-variant rounded-[20px] transition-colors active:bg-surface-container">
<span class="text-[24px] leading-none mb-1">🧼</span>
<span class="font-label-md">Lavado</span>
</button>
</div>
<!-- Form Fields -->
<div class="flex flex-col gap-4">
<!-- Cost Input (Active/Focused look) -->
<div class="flex flex-col gap-2 relative">
<label class="font-label-md text-primary ml-1">Costo ($)</label>
<div class="w-full h-14 bg-primary/5 rounded-[20px] flex items-center px-4 relative overflow-hidden">
<span class="font-headline-sm text-primary mr-2">$</span>
<input autofocus="" class="w-full bg-transparent font-headline-sm text-primary placeholder-primary/40 focus:outline-none" inputmode="decimal" placeholder="0.00" type="number" value=""/>
<!-- Faint bottom highlight instead of border -->
<div class="absolute bottom-0 left-0 right-0 h-0.5 bg-primary"></div>
</div>
</div>
<!-- Odometer Input (Inactive look) -->
<div class="flex flex-col gap-2 relative">
<label class="font-label-md text-on-surface-variant ml-1">Kilometraje Actual</label>
<div class="w-full h-14 bg-surface-container-lowest rounded-[20px] flex items-center px-4 relative overflow-hidden shadow-[inset_0_-1px_0_var(--tw-colors-outline-variant)]">

<input class="w-full bg-transparent font-body-lg text-on-surface placeholder-on-surface-variant/50 focus:outline-none" inputmode="numeric" placeholder="Ej. 45,200" type="number"/>
</div>
</div>
</div>
<!-- Save Button -->
<button class="w-full h-14 mt-4 bg-primary text-on-primary rounded-full font-headline-sm shadow-[0_4px_12px_rgba(0,88,190,0.25)] flex items-center justify-center gap-2 active:bg-on-primary-fixed transition-colors relative overflow-hidden group">
<span class="material-symbols-outlined text-[20px]">check_circle</span>
        Guardar Registro
        <!-- Touch ripple effect mockup -->
<div class="absolute inset-0 bg-black/0 group-active:bg-black/10 transition-colors pointer-events-none"></div>
</button>
</div>
</div>
<script>
    // Simple script to trigger the bottom sheet slide-in on load for a delightful entrance
    requestAnimationFrame(() => {
      setTimeout(() => {
        const sheet = document.getElementById('bottom-sheet');
        const scrim = document.getElementById('scrim');
        if(sheet && scrim) {
          sheet.classList.remove('translate-y-full');
          scrim.classList.remove('opacity-0');
        }
      }, 50);
    });
  </script>
</div></main></body></html>
