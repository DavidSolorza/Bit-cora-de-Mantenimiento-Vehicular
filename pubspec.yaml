name: stitch_stepway_fleet_manager
description: Aplicación de gestión y bitácora de mantenimiento para Renault Sandero Stepway.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  sqflite: ^2.3.0
  path: ^1.9.0
  image_picker: ^1.1.2
  path_provider: ^2.1.3
  flutter_local_notifications: ^17.2.1
  google_sign_in: ^6.2.1
  shared_preferences: ^2.2.0
  pdf: ^3.10.8
  share_plus: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  mocktail: ^1.0.4
  bloc_test: ^9.1.7

flutter_launcher_icons:
  android: "yes"
  ios: true
  image_path: "assets/icon/app_launcher_icon.jpg"

flutter:
  uses-material-design: true

  # Declarar los assets explícitamente permite al compilador
  # hacer tree-shaking de recursos no referenciados en el código.
  assets:
    - assets/icon/
